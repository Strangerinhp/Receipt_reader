name: invoice-ocr-sqlite

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.sqlite
    environment:
      DATABASE_ENGINE: sqlite
      SQLITE_DATABASE_PATH: /data/invoice_ocr.db
      AUTO_INIT_DB: "true"
      FRONTEND_ORIGIN: http://localhost:${FRONTEND_PORT:-3000}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    volumes:
      - sqlite_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_BACKEND_URL: /api
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  sqlite_data:
